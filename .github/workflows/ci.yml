name: ci
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
jobs:
  check:
    strategy:
      matrix:
        go-version:
          - 1.27.x
        os:
          - ubuntu

    name: build (${{ matrix.os }}/go-${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go-version }}

    - run: |
        make bootstrap
        make check

  test:
    strategy:
      matrix:
        go-version:
          - 1.27.x
        os:
          - ubuntu

    name: test (${{ matrix.os }}/go-${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}-latest
    services:
      rustfs:
        image: rustfs/rustfs:1.0.4
        ports:
          - 45677:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_CONSOLE_ENABLE: 'false'
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go-version }}
    - run: sudo apt-get update && sudo apt-get install -y fuse3
    - run: make test
      env:
        TEST_ENDPOINT_URL: http://localhost:45677
