networks:
  goofys-tests:
    driver: bridge

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - 127.0.0.1:9000:9000
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: 'false'
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/health/ready]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - goofys-tests

  tests:
    image: goofys-ci
    build: 
      context: ./goofys-ci
      args:
        GO_VERSION: 1.27.3
    
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    volumes:
      - ../:/code
    environment:
      TEST_ENDPOINT_URL: http://rustfs:9000
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - goofys-tests
    command: bash -c "cd /code/; ./test/run-tests.sh"
